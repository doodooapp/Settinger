<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self';" />
  <title>Settinger — Sign in</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Login is its own centred layout; it inherits every token from
       styles.css so the two screens feel like one product. */
    .login-wrap {
      position: relative; z-index: 1;
      height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .login-card {
      width: 100%; max-width: 384px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px 36px 30px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }
    .login-logo { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 28px; }
    .login-logo img { width: 56px; height: 56px; }
    .login-logo .name { font-weight: 700; font-size: 24px; letter-spacing: -0.01em; margin-top: 14px; }
    .login-logo .name b { color: var(--red); }
    .login-logo .sub {
      font-size: 10.5px; font-weight: 600; letter-spacing: 2px;
      color: var(--text-faint); margin-top: 3px; text-transform: uppercase;
    }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 12px; font-weight: 550;
      color: var(--text-dim); margin-bottom: 6px;
    }
    .field input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--r-md); color: var(--text); padding: 10px 13px;
      font-size: 13.5px; font-family: var(--body);
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .field input::placeholder { color: var(--text-faint); }
    .field input:focus { border-color: var(--border-bright); background: var(--bg-elevated-2); outline: none; }

    .login-actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
    .login-actions .btn { width: 100%; padding: 11px 16px; font-size: 13.5px; text-decoration: none; }

    .dev-flag {
      margin-top: 20px; text-align: center; font-size: 11px;
      color: var(--text-faint);
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .dev-flag .led { width: 6px; height: 6px; border-radius: 99px; background: var(--warn); flex: none; }
  </style>
</head>
<body>
  <div class="hex-backdrop"></div>
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-logo">
        <img src="../assets/logo.svg" alt="Settinger logo" />
        <div class="name">Settinge<b>r</b></div>
        <div class="sub">Rig Tuner</div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>

      <div class="login-actions">
        <a class="btn primary" href="app.html">Log in</a>
        <a class="btn ghost" href="app.html">Skip for now &rarr;</a>
      </div>

      <div class="dev-flag"><span class="led"></span> Dev build — authentication not yet wired</div>
    </section>
  </main>
</body>
</html>
